<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>整改上报 · 员工专属通道</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="topbar">
  <h1>🔧 整改上报通道</h1>
  <div class="sub" id="who">员工专属链接 · 请勿外传</div>
</div>

<div class="wrap" id="app">
  <div class="card"><div class="empty">加载中…</div></div>
</div>

<div class="toast" id="toast"></div>
<div class="lightbox" id="lightbox" onclick="this.classList.remove('show')"><img id="lightboxImg"></div>

<script>
const $ = (s) => document.querySelector(s);
const token = new URLSearchParams(location.search).get('token') || '';
const toast = (msg, err) => {
  const t = $('#toast'); t.textContent = msg;
  t.className = 'toast show' + (err ? ' err' : '');
  setTimeout(() => t.classList.remove('show'), 2600);
};
const fmt = (iso) => new Date(iso).toLocaleString('zh-CN', { hour12: false });
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function zoom(src) { $('#lightboxImg').src = src; $('#lightbox').classList.add('show'); }

async function load() {
  let j;
  try {
    const r = await fetch('/api/staff/' + encodeURIComponent(token));
    j = await r.json();
    if (!r.ok) throw new Error(j.error || '加载失败');
  } catch (err) {
    $('#app').innerHTML = `<div class="card error-box"><div class="icon">🚫</div>
      <h2>无法访问</h2><p>${esc(err.message)}</p></div>`;
    return;
  }
  $('#who').textContent = `${j.employee.name} · ${j.employee.roleLabel} · 专属链接请勿外传`;

  const pendingHtml = j.pending.length ? j.pending.map(i => `
    <div class="task" id="task-${i.id}">
      <div class="task-head">
        <div>
          <span class="badge area">${esc(i.areaLabel)}</span>
          <span class="badge deduct">-${i.deduction} 分 · 待整改</span>
          <div class="loc">📍 ${esc(i.location)}</div>
        </div>
      </div>
      ${i.description ? `<div class="desc">${esc(i.description)}</div>` : ''}
      <div class="time">上报：${esc(i.inspector)} · ${fmt(i.createdAt)}</div>
      <div class="single-photo"><img src="${i.photo}" onclick="zoom('${i.photo}')" alt="问题照片"></div>
      <form class="rectify-form" data-id="${i.id}" style="margin-top:12px">
        <label class="file-drop">📷 上传整改后照片
          <input type="file" accept="image/*" capture="environment" required>
        </label>
        <input type="text" name="note" placeholder="整改说明（选填）" style="margin-top:8px">
        <button class="btn green block" type="submit">提交整改</button>
      </form>
    </div>`).join('')
    : '<div class="empty">🎉 当前没有待整改问题</div>';

  const doneHtml = j.done.length ? j.done.map(i => `
    <div class="task">
      <div class="task-head">
        <div>
          <span class="badge area">${esc(i.areaLabel)}</span>
          <span class="badge done">✓ 已整改</span>
          <div class="loc">📍 ${esc(i.location)}</div>
        </div>
      </div>
      <div class="photo-pair">
        <figure class="before"><img src="${i.photo}" onclick="zoom('${i.photo}')"><figcaption>整改前</figcaption></figure>
        <figure class="after"><img src="${i.rectification.photo}" onclick="zoom('${i.rectification.photo}')"><figcaption>整改后 · ${fmt(i.rectification.rectifiedAt)}</figcaption></figure>
      </div>
    </div>`).join('')
    : '<div class="empty">还没有整改记录</div>';

  $('#app').innerHTML = `
    <div class="card"><h2>待整改问题（${j.pending.length}）</h2>${pendingHtml}</div>
    <div class="card"><h2>我的整改记录（${j.done.length}）</h2>${doneHtml}</div>`;

  document.querySelectorAll('.rectify-form').forEach(form => {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = form.dataset.id;
      const btn = form.querySelector('button');
      const fd = new FormData();
      fd.append('photo', form.querySelector('input[type=file]').files[0]);
      fd.append('note', form.querySelector('input[name=note]').value);
      btn.disabled = true; btn.textContent = '上传中…';
      try {
        const r = await fetch(`/api/staff/${encodeURIComponent(token)}/rectify/${id}`, { method: 'POST', body: fd });
        const jj = await r.json();
        if (!r.ok) throw new Error(jj.error || '提交失败');
        toast('✅ 整改提交成功');
        load();
      } catch (err) {
        toast(err.message, true);
        btn.disabled = false; btn.textContent = '提交整改';
      }
    });
  });
}

if (!token) {
  $('#app').innerHTML = `<div class="card error-box"><div class="icon">🚫</div>
    <h2>缺少访问凭证</h2><p>请通过专属二维码或链接进入</p></div>`;
} else load();
</script>
</body>
</html>
